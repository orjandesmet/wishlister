name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels the run that's still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A stalled step fails the job instead of hanging for hours.
    timeout-minutes: 10
    # The Storybook tests run in a real Chromium. This image ships it together with its
    # system libraries, so nothing is downloaded or installed per run. Keep the tag in
    # step with the pinned `playwright` version in package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # Installs Vite+, Node and pnpm (pinned by devEngines), then runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # Format, lint and type check.
      - run: vp check
      - run: vp test
      - run: pnpm run build
