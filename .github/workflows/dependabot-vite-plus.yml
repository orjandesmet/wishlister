name: Align Vite+ on Dependabot PRs

# Dependabot sees `vite-plus`, the `vite` alias (vite-plus-core) and the Vitest pins in
# pnpm-workspace.yaml as unrelated packages, so it bumps one without the others and the
# type check breaks. `vp migrate` sets all of them to what the installed vite-plus needs.
# This job runs it on Dependabot's npm PRs and pushes the result to the PR branch.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: align-vite-plus-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  align:
    # Only Dependabot's own pushes, so a fix pushed by a person is never overwritten.
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push the fix to the PR branch.
      contents: write
      # Start CI again: a push made with GITHUB_TOKEN doesn't trigger workflows by itself.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Run vp migrate
        run: vp migrate --no-interactive --no-agent --no-editor --no-hooks
      - name: Push the changes, if any
        id: push
        run: |
          if git diff --quiet; then
            echo "Vite+ versions already line up."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --no-verify --message "deps: align Vite+ core, Vitest and overrides with vp migrate"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ github.head_ref }}"
