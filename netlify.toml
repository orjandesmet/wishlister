[dev]
targetPort = 5173
port = 8888

[build]
command = "pnpm run build"
publish = "dist"
# Production only goes live on a release tag, by hand or with the `deploy now` PR label,
# through .github/workflows/deploy.yml. So Netlify skips its own production builds of main
# (exit 0 = skip). Deploy previews and the demo branch deploy still build here, and the
# workflow's build (GITHUB_ACTIONS is set there) goes ahead.
ignore = "[ \"$CONTEXT\" = production ] && [ -z \"$GITHUB_ACTIONS\" ]"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "12.11.2"

# Single-page app: let the client-side router handle every path.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Family-and-friends app: keep every page out of search engines.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow, noarchive"
