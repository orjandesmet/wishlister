[build]
command = "pnpm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "12.11.2"

# Single-page app: let the client-side router handle every path.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Family-and-friends app: keep every page out of search engines.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow, noarchive"
